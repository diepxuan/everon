# .github/workflows/sync.yml — Đồng bộ catalog + ảnh tự lưu cho everon.site
# Theo phương án everon.site mục 5 + chiến lược ảnh. CẬP NHẬT 26/11/2026:
# site giờ có TOÀN BỘ catalog (12 danh mục, 437 SP) thay vì chỉ Bộ chăn ga.
#
# Luồng chạy (thứ tự quan trọng):
#   1. scrape-full.mjs — cập nhật dữ liệu từ everon.com (sitemap + variation),
#      chạy RIÊNG TỪNG DANH MỤC (--category <id>), 12 danh mục:
#        dem, dem-k-bedding, k-bedding, tre-em, bo-chan-ga-artemis,
#        bo-chan-ga, ga, vo-goi, chan-va-vo-chan, ruot, goi, phu-kien.
#      Tăng dần THẬT SỰ theo sitemap lastmod (so với lastmod đã lưu trong
#      data/sync-state.json): chỉ cào lại URL mới/đổi, giữ lại phần còn lại
#      từ data/products.json.
#   2. export-site-data.mjs — gộp 12 wrapper thành data/products.json
#      (UNION biến thể theo (set_type, size) khi cùng SKU xuất hiện ở
#      nhiều danh mục; danh mục nào không cào lần này thì giữ nguyên từ
#      products.json cũ) + cập nhật sync-state.json.
#   3. images.mjs — tải ảnh MỚI/THAY ĐỔI về assets/img/products/<sku>/*.webp.
#   4. validate.mjs (+ safety gate) — chặn nếu mất >10% catalog hoặc giá = 0.
#   5. diff.mjs — tóm tắt thay đổi để đưa vào mô tả PR.
#   6. Dọn file trung gian — xóa data/products-<id>.full.json(.jsonl),
#      data/state-<id>.json, data/run-stats-<id>.json,
#      data/discovery-<id>.json, data/sync-diff.json TRƯỚC khi tạo PR,
#      để PR sau chỉ gồm dữ liệu thật (products.json, sync-state.json,
#      image-manifest.json) + ảnh.
#   7. peter-evans/create-pull-request — mở PR để DUYỆT THỦ CÔNG, KHÔNG tự merge.
#      Action chỉ mở PR khi có thay đổi thật (không có thay đổi thì không làm gì).
#
# Lịch: hằng ngày 03:00 giờ Việt Nam (20:00 UTC).
#   - Mỗi ngày: tăng dần cho cả 12 danh mục + QUÉT TOÀN BỘ 2 danh mục
#     XOAY VÒNG theo ngày trong năm (6 cặp, mỗi danh mục được quét toàn bộ
#     1 lần / 6 ngày). Quét toàn bộ cả 12 danh mục trong 1 lần chạy sẽ mất
#     ~6–7 giờ, VƯỢT timeout tối đa của GitHub Actions (360 phút) nên
#     KHÔNG quét toàn bộ hằng ngày.
#   - Chạy tay (workflow_dispatch, tick full_scan): quét toàn bộ cả 12 danh
#     mục. Timeout job 360 phút (tối đa cho phép); nếu vẫn quá giờ, chạy lại
#     với full_scan lần nữa — scraper có checkpoint (--resume) và export giữ
#     nguyên danh mục chưa cào xong, nên lần chạy sau tiếp tục từ chỗ dở.
#   - Chạy tay với input `categories` (vd "vo-goi,chan-va-vo-chan"): chỉ
#     sync các danh mục đó (tăng dần, trừ khi tick full_scan).
# Chạy tay: Actions > Sync catalog > Run workflow, tick full_scan nếu muốn quét toàn bộ.
name: Sync catalog from everon.com

on:
  schedule:
    - cron: "0 20 * * *" # 03:00 giờ Việt Nam, hằng ngày
  workflow_dispatch:
    inputs:
      full_scan:
        description: "Quét toàn bộ (bỏ qua checkpoint, chạy discovery lại từ đầu)"
        type: boolean
        default: false
      categories:
        description: "Chỉ sync các danh mục này (vd: vo-goi,chan-va-vo-chan). Để trống = cả 12 danh mục."
        type: string
        default: ""

concurrency:
  group: catalog-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # quét toàn bộ tay ~6-7h có thể quá giờ; chạy hằng ngày (xoay vòng) chỉ ~1-2h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Đảm bảo ffmpeg (chuyển ảnh sang WebP)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libwebp; then
            echo "ffmpeg chưa có sẵn — cài qua apt..."
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -hide_banner -encoders | grep libwebp

      - name: Lưu bản dữ liệu hiện tại (để diff + safety gate)
        run: |
          if [ -f data/products.json ]; then
            cp data/products.json /tmp/products-prev.json
          else
            echo "Chưa có data/products.json — lần chạy đầu tiên, không có bản trước để so."
            echo "[]" > /tmp/products-prev.json
          fi

      - name: Xác định danh mục + quét toàn bộ hay tăng dần
        id: mode
        run: |
          # 12 danh mục, thứ tự = thứ tự export (tre-em/artemis trước bo-chan-ga
          # để SP chuyển danh mục thắng khi gộp; bo-chan-ga trước vo-goi/chan
          # để trang bộ thắng khi UNION biến thể).
          ALL_CATS="dem dem-k-bedding k-bedding tre-em bo-chan-ga-artemis bo-chan-ga ga vo-goi chan-va-vo-chan ruot goi phu-kien"
          # 6 cặp xoay vòng (mỗi danh mục quét toàn bộ 1 lần / 6 ngày).
          PAIRS="dem,dem-k-bedding k-bedding,tre-em bo-chan-ga-artemis,bo-chan-ga ga,vo-goi chan-va-vo-chan,ruot goi,phu-kien"
          if [ "${{ inputs.full_scan }}" = "true" ]; then
            CATS="$ALL_CATS"
            FULL_CATS="$ALL_CATS"
            echo "Quét TOÀN BỘ cả 12 danh mục (chạy tay yêu cầu full_scan)."
          elif [ -n "${{ inputs.categories }}" ]; then
            CATS=$(echo "${{ inputs.categories }}" | tr ',' ' ')
            FULL_CATS=""
            echo "Chỉ sync các danh mục: $CATS (tăng dần)."
          else
            # Chạy lịch hằng ngày: tăng dần cả 12 + quét toàn bộ 2 danh mục xoay vòng.
            DOY_VN=$(TZ=Asia/Ho_Chi_Minh date +%j)
            IDX=$((10#$DOY_VN % 6))
            CATS="$ALL_CATS"
            FULL_CATS=$(echo "$PAIRS" | cut -d' ' -f$((IDX + 1)) | tr ',' ' ')
            echo "Quét tăng dần cả 12 danh mục + quét toàn bộ xoay vòng: $FULL_CATS (ngày $DOY_VN, cặp $((IDX + 1))/6)."
          fi
          echo "cats=$CATS" >> "$GITHUB_OUTPUT"
          echo "full_cats=$FULL_CATS" >> "$GITHUB_OUTPUT"

      - name: Sync catalog (12 danh mục)
        run: |
          set -u
          FULL_CATS=" ${{ steps.mode.outputs.full_cats }} "
          for CAT in ${{ steps.mode.outputs.cats }}; do
            if [[ "$FULL_CATS" == *" $CAT "* ]]; then
              echo "=== $CAT: quét toàn bộ (--full) ==="
              node scripts/sync/scrape-full.mjs --category "$CAT" --full || node scripts/sync/scrape-full.mjs --category "$CAT" --full --resume
            else
              echo "=== $CAT: tăng dần theo lastmod ==="
              node scripts/sync/scrape-full.mjs --category "$CAT" || node scripts/sync/scrape-full.mjs --category "$CAT" --resume
            fi
          done

      - name: Xuất dữ liệu site + cập nhật sync-state
        run: node scripts/sync/export-site-data.mjs

      - name: Tải + chuyển ảnh sang WebP
        run: node scripts/sync/images.mjs

      - name: Validate + safety gate
        run: node scripts/sync/validate.mjs data/products.json --manifest data/image-manifest.json --prev /tmp/products-prev.json

      - name: Diff vs trước đó
        run: node scripts/sync/diff.mjs /tmp/products-prev.json data/products.json > data/sync-diff.json

      - name: Soạn mô tả PR
        run: |
          node -e "
          const fs = require('fs');
          const diff = JSON.parse(fs.readFileSync('data/sync-diff.json', 'utf8'));
          const man = JSON.parse(fs.readFileSync('data/image-manifest.json', 'utf8'));
          const s = man.summary || {};
          const vnd = (n) => Number(n || 0).toLocaleString('vi-VN') + 'đ';
          const list = (arr, fmt, max = 20) => arr.slice(0, max).map(fmt).join('\n') + (arr.length > max ? '\n- ... và ' + (arr.length - max) + ' mục nữa' : '');
          const lines = [
            'Đồng bộ tự động từ everon.com (sitemap + product-variation). Duyệt thủ công trước khi merge — KHÔNG tự merge.',
            '',
            '## Dữ liệu',
            '- Sản phẩm: ' + diff.old_count + ' → ' + diff.new_count,
            '- Mới thêm (' + diff.added_count + '): ' + (diff.added.join(', ') || 'không có'),
            '- Bị gỡ (' + diff.removed_count + '): ' + (diff.removed.join(', ') || 'không có'),
            '- Đổi giá (' + diff.price_changes.length + '):',
            list(diff.price_changes, (c) => '  - ' + c.sku + ': ' + vnd(c.old_price) + ' → ' + vnd(c.new_price)),
            '- Đổi trạng thái (' + diff.status_changes.length + '):',
            list(diff.status_changes, (c) => '  - ' + c.sku + ': ' + c.old_status + ' → ' + c.new_status),
            '- Đổi ảnh gốc (' + diff.media_changes.length + ' SP):',
            list(diff.media_changes, (c) => '  - ' + c.sku + ': +' + c.added_images.length + ' ảnh, -' + c.removed_images.length + ' ảnh'),
            '',
            '## Ảnh tự lưu (assets/img/products/)',
            '- Tổng: ' + s.total + ' ảnh; tải mới/chuyển WebP: ' + s.downloaded + '; bỏ qua (không đổi): ' + s.skipped + '; lỗi: ' + s.failed + '; giữ định dạng gốc: ' + (s.fallback_original || 0),
            '- Dung lượng ảnh mới: ' + ((s.bytes_total || 0) / 1024).toFixed(0) + ' KB',
            '',
            '## Kiểm tra',
            '- validate.mjs + safety gate (mất >10% catalog hoặc giá = 0 thì chặn): đã qua.',
            '- Xem tab Files changed của PR để thấy toàn bộ file đổi (data/sync-diff.json không còn commit nữa — chỉ dùng trong lần chạy để soạn mô tả này).',
          ];
          fs.writeFileSync('/tmp/PR_BODY.md', lines.join('\n') + '\n');
          console.log('Da soan mo ta PR (' + lines.length + ' dong).');
          "

      - name: Dọn file trung gian (chỉ commit dữ liệu + ảnh)
        run: |
          # File trung gian chỉ dùng trong lần chạy, KHÔNG commit nữa.
          # Mỗi danh mục có 5 file: products-<id>.full.json(.jsonl),
          # state-<id>.json, run-stats-<id>.json, discovery-<id>.json.
          # (export-site-data đã đọc xong wrapper ở bước trước; lần chạy sau
          # tăng dần theo lastmod trong sync-state.json, không dùng state.json.)
          for CAT in dem dem-k-bedding k-bedding tre-em bo-chan-ga-artemis bo-chan-ga ga vo-goi chan-va-vo-chan ruot goi phu-kien; do
            rm -f "data/products-${CAT}.full.json" "data/products-${CAT}.full.jsonl" "data/state-${CAT}.json" "data/run-stats-${CAT}.json" "data/discovery-${CAT}.json"
          done
          rm -f data/sync-diff.json
          echo "Đã dọn file trung gian. File data/ còn lại:"
          ls -la data/

      - name: Mở PR để duyệt thủ công
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Cập nhật catalog từ everon.com"
          branch: "sync/catalog"
          commit-message: "sync: cập nhật catalog từ everon.com"
          body-path: /tmp/PR_BODY.md
