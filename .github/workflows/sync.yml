# .github/workflows/sync.yml — Đồng bộ catalog + ảnh tự lưu cho everon.site
# CẬP NHẬT 28/11/2026 — chế độ hàng đợi (chunk), thay cho lịch hằng ngày cũ:
#   - File hàng đợi data/crawl-queue.json: 1 dòng/SP {url, sku, categories,
#     sub_type, last_crawl}. Mỗi job lấy 1 batch (~60 SP chưa cào) rồi cào
#     đầy đủ từng SP (tuần tự, kèm đủ biến thể, ngân sách 40 lần gọi biến
#     thể giữ nguyên), ghi dấu last_crawl. Tốc độ đo được ~95 giây/SP
#     (log run #12) nên 1 batch ~95 phút, vừa trong ~2 tiếng.
#   - Cron MỖI GIỜ; job nào đang chạy thì job mới TỰ BỎ QUA (guard), không
#     xếp hàng, không chạy chồng. Timeout job giữ 360 phút như cũ (để chạy
#     tay full_scan khẩn cấp không bị cắt); chunk ~2 tiếng đạt được nhờ
#     cỡ batch (60), không nhờ timeout.
#   - Hết file (không còn SP chưa cào) thì chạy LAST CHUNK: discovery lại
#     toàn bộ nguồn, bổ sung SP mới vào file, ghi SP đã biến mất vào
#     data/queue-removed.json (export áp dụng khi mở PR, qua safety gate),
#     rồi XÓA SẠCH last_crawl để bắt đầu vòng mới. Không còn quét toàn bộ
#     riêng vào Chủ nhật nữa.
#   - File hàng đợi được commit TRỰC TIẾP lên main sau mỗi job (chỉ file
#     này — dữ liệu sản phẩm vẫn qua PR duyệt thủ công). Nếu không commit
#     thẳng thì chunk sau không thấy dấu đã cào và sẽ cào lặp.
#   - Mỗi job mở PR riêng (branch sync/catalog-<run_id>) nếu có thay đổi.
# Chạy tay: Actions > Sync catalog > Run workflow.
#   - tick full_scan: quét toàn bộ cả 12 danh mục (chế độ cũ, khẩn cấp).
#   - nhập categories (vd "vo-goi,chan-va-vo-chan"): chỉ sync các danh mục
#     đó (tăng dần, chế độ cũ).
#   - tick force_last_chunk: chạy last chunk ngay (không đợi hết file).
name: Sync catalog from everon.com

on:
  schedule:
    - cron: "0 * * * *" # mỗi giờ
  workflow_dispatch:
    inputs:
      full_scan:
        description: "Quét toàn bộ (bỏ qua checkpoint, chạy discovery lại từ đầu)"
        type: boolean
        default: false
      categories:
        description: "Chỉ sync các danh mục này (vd: vo-goi,chan-va-vo-chan). Để trống = theo hàng đợi."
        type: string
        default: ""
      batch_size:
        description: "Số sản phẩm mỗi chunk (mặc định 60, ~95 giây/SP)"
        type: string
        default: "60"
      force_last_chunk:
        description: "Chạy last chunk ngay (discovery + reset hàng đợi)"
        type: boolean
        default: false

concurrency:
  group: catalog-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # chunk ~2 tiếng nhờ cỡ batch; giữ 360 để chạy tay full_scan khẩn cấp không bị cắt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Đảm bảo ffmpeg (chuyển ảnh sang WebP)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libwebp; then
            echo "ffmpeg chưa có sẵn — cài qua apt..."
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -hide_banner -encoders | grep libwebp

      - name: Lưu bản dữ liệu hiện tại (để diff + safety gate)
        run: |
          if [ -f data/products.json ]; then
            cp data/products.json /tmp/products-prev.json
          else
            echo "Chưa có data/products.json — lần chạy đầu tiên, không có bản trước để so."
            echo "[]" > /tmp/products-prev.json
          fi

      - name: Bỏ qua nếu đang có job chạy (guard)
        id: guard
        run: |
          RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/sync.yml/runs?status=in_progress&per_page=10" --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length')
          if [ "$RUNS" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Đã có $RUNS job sync đang chạy — bỏ qua lần này, đợi tick cron sau."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Không có job sync nào đang chạy — tiếp tục."
          fi

      - name: Xác định chế độ chạy (hàng đợi / chạy tay)
        id: mode
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ "${{ inputs.full_scan }}" = "true" ]; then
            echo "mode=legacy" >> "$GITHUB_OUTPUT"
            echo "cats=dem dem-k-bedding k-bedding tre-em bo-chan-ga-artemis bo-chan-ga ga vo-goi chan-va-vo-chan ruot goi phu-kien" >> "$GITHUB_OUTPUT"
            echo "full_cats=dem dem-k-bedding k-bedding tre-em bo-chan-ga-artemis bo-chan-ga ga vo-goi chan-va-vo-chan ruot goi phu-kien" >> "$GITHUB_OUTPUT"
            echo "Chạy tay: quét toàn bộ cả 12 danh mục (chế độ cũ)."
          elif [ -n "${{ inputs.categories }}" ]; then
            echo "mode=legacy" >> "$GITHUB_OUTPUT"
            echo "cats=$(echo "${{ inputs.categories }}" | tr ',' ' ')" >> "$GITHUB_OUTPUT"
            echo "full_cats=" >> "$GITHUB_OUTPUT"
            echo "Chạy tay: chỉ sync các danh mục: ${{ inputs.categories }} (tăng dần, chế độ cũ)."
          elif [ "${{ inputs.force_last_chunk }}" = "true" ]; then
            echo "mode=queue-last" >> "$GITHUB_OUTPUT"
            echo "Chạy tay: last chunk (discovery + reset hàng đợi)."
          else
            echo "mode=queue" >> "$GITHUB_OUTPUT"
            echo "Chạy lịch: batch tiếp theo từ file hàng đợi."
          fi

      - name: Chọn batch từ file hàng đợi
        id: batch
        if: steps.guard.outputs.skip != 'true' && steps.mode.outputs.mode == 'queue'
        run: |
          node scripts/sync/queue.mjs select --batch-size "${{ inputs.batch_size || '60' }}" | tee /tmp/queue-select.log
          if grep -q '^LAST_CHUNK=true' /tmp/queue-select.log; then
            echo "last_chunk=true" >> "$GITHUB_OUTPUT"
          else
            echo "last_chunk=false" >> "$GITHUB_OUTPUT"
          fi
          # Nhãn chunk + danh sách danh mục cho các bước sau (từ queue-batch.json).
          node -e "
            const fs = require('fs');
            const b = JSON.parse(fs.readFileSync('data/queue-batch.json', 'utf8'));
            const label = b.categories.map((c) => c.id + ' x' + c.urls.length).join(' + ') || 'last chunk';
            const cats = b.categories.map((c) => c.id).join(' ');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'chunk_label=' + label + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'batch_cats=' + cats + '\n');
            console.log('Chunk: ' + label);
          "

      - name: Sync batch (hàng đợi)
        if: steps.guard.outputs.skip != 'true' && steps.mode.outputs.mode == 'queue' && steps.batch.outputs.last_chunk != 'true'
        run: |
          set -u
          for CAT in ${{ steps.batch.outputs.batch_cats }}; do
            echo "=== $CAT: batch tu hang doi ==="
            node scripts/sync/scrape-full.mjs --category "$CAT" --urls-file "data/queue-urls-${CAT}.txt" --queue data/crawl-queue.json || node scripts/sync/scrape-full.mjs --category "$CAT" --urls-file "data/queue-urls-${CAT}.txt" --queue data/crawl-queue.json --resume
          done

      - name: Last chunk — discovery + reset hàng đợi
        id: lastchunk
        if: steps.guard.outputs.skip != 'true' && (steps.mode.outputs.mode == 'queue-last' || steps.batch.outputs.last_chunk == 'true')
        run: |
          node scripts/sync/scrape-full.mjs --discover-all
          node scripts/sync/queue.mjs merge-discovery
          REMOVED=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/queue-removed.json','utf8')).removed.length)")
          echo "removed_count=$REMOVED" >> "$GITHUB_OUTPUT"
          if [ "$REMOVED" = "0" ]; then
            echo "skip_pipeline=true" >> "$GITHUB_OUTPUT"
            echo "Last chunk: không có SP nào biến mất — chỉ reset hàng đợi, không mở PR."
          else
            echo "skip_pipeline=false" >> "$GITHUB_OUTPUT"
            echo "Last chunk: $REMOVED SP đã biến mất — sẽ mở PR gỡ chúng (qua safety gate)."
          fi

      - name: Sync catalog (chế độ cũ — chạy tay)
        if: steps.guard.outputs.skip != 'true' && steps.mode.outputs.mode == 'legacy'
        run: |
          set -u
          FULL_CATS=" ${{ steps.mode.outputs.full_cats }} "
          for CAT in ${{ steps.mode.outputs.cats }}; do
            if [[ "$FULL_CATS" == *" $CAT "* ]]; then
              echo "=== $CAT: quét toàn bộ (--full) ==="
              node scripts/sync/scrape-full.mjs --category "$CAT" --full || node scripts/sync/scrape-full.mjs --category "$CAT" --full --resume
            else
              echo "=== $CAT: tăng dần theo lastmod ==="
              node scripts/sync/scrape-full.mjs --category "$CAT" || node scripts/sync/scrape-full.mjs --category "$CAT" --resume
            fi
          done

      - name: Xuất dữ liệu site + cập nhật sync-state
        if: steps.guard.outputs.skip != 'true' && steps.lastchunk.outputs.skip_pipeline != 'true'
        run: |
          if [ -n "${{ steps.lastchunk.outputs.removed_count }}" ] && [ "${{ steps.lastchunk.outputs.removed_count }}" != "0" ]; then
            echo "Last chunk: chỉ áp dụng danh sách xóa."
            node scripts/sync/export-site-data.mjs --remove-only
          else
            node scripts/sync/export-site-data.mjs
          fi

      - name: Tải + chuyển ảnh sang WebP
        if: steps.guard.outputs.skip != 'true' && steps.lastchunk.outputs.skip_pipeline != 'true'
        run: node scripts/sync/images.mjs

      - name: Validate + safety gate
        if: steps.guard.outputs.skip != 'true' && steps.lastchunk.outputs.skip_pipeline != 'true'
        run: node scripts/sync/validate.mjs data/products.json --manifest data/image-manifest.json --prev /tmp/products-prev.json

      - name: Commit file hàng đợi lên main (trực tiếp)
        if: steps.guard.outputs.skip != 'true' && (steps.mode.outputs.mode == 'queue' || steps.mode.outputs.mode == 'queue-last')
        run: |
          # Chỉ file hàng đợi được commit thẳng (dữ liệu SP vẫn qua PR).
          # Dùng GitHub API để không phụ thuộc git history (checkout nông).
          # Chạy sau khi validate qua — nếu validate lỗi thì không commit,
          # chunk sau sẽ cào lại batch này (không mất dữ liệu, chỉ tốn thời gian).
          if [ ! -f data/crawl-queue.json ]; then echo "Không có file hàng đợi — bỏ qua."; exit 0; fi
          LABEL="${{ steps.batch.outputs.chunk_label }}"
          [ -n "$LABEL" ] || LABEL="last chunk"
          CONTENT_B64=$(base64 -w0 data/crawl-queue.json)
          SHA=$(gh api "repos/${{ github.repository }}/contents/data/crawl-queue.json?ref=main" --jq '.sha')
          for i in 1 2 3; do
            if gh api "repos/${{ github.repository }}/contents/data/crawl-queue.json" -X PUT -f message="sync: cập nhật hàng đợi crawl ($LABEL)" -f content="$CONTENT_B64" -f sha="$SHA" -f branch="main" --jq '.commit.sha'; then
              echo "Đã commit file hàng đợi lên main."
              break
            fi
            echo "PUT hàng đợi thất bại (lần $i) — lấy lại SHA rồi thử lại..."
            sleep 5
            SHA=$(gh api "repos/${{ github.repository }}/contents/data/crawl-queue.json?ref=main" --jq '.sha')
          done

      - name: Diff vs trước đó
        if: steps.guard.outputs.skip != 'true' && steps.lastchunk.outputs.skip_pipeline != 'true'
        run: node scripts/sync/diff.mjs /tmp/products-prev.json data/products.json > data/sync-diff.json

      - name: Soạn mô tả PR
        if: steps.guard.outputs.skip != 'true' && steps.lastchunk.outputs.skip_pipeline != 'true'
        run: |
          node -e "
          const fs = require('fs');
          const diff = JSON.parse(fs.readFileSync('data/sync-diff.json', 'utf8'));
          const man = JSON.parse(fs.readFileSync('data/image-manifest.json', 'utf8'));
          const s = man.summary || {};
          const vnd = (n) => Number(n || 0).toLocaleString('vi-VN') + 'đ';
          const list = (arr, fmt, max = 20) => arr.slice(0, max).map(fmt).join('\n') + (arr.length > max ? '\n- ... và ' + (arr.length - max) + ' mục nữa' : '');
          const batch = (() => { try { return JSON.parse(fs.readFileSync('data/queue-batch.json', 'utf8')); } catch { return null; } })();
          const chunkLine = batch ? (batch.last_chunk ? 'Chunk: last chunk (discovery + reset hàng đợi)' : 'Chunk: ' + batch.categories.map((c) => c.id + ' x' + c.urls.length).join(' + ') + ' — còn ' + (batch.total_unmarked - batch.categories.reduce((a, c) => a + c.urls.length, 0)) + ' SP chưa cào trong vòng này') : 'Chạy tay (chế độ cũ).';
          const lines = [
            'Đồng bộ tự động từ everon.com (sitemap + product-variation). Duyệt thủ công trước khi merge — KHÔNG tự merge.',
            chunkLine,
            '',
            '## Dữ liệu',
            '- Sản phẩm: ' + diff.old_count + ' → ' + diff.new_count,
            '- Mới thêm (' + diff.added_count + '): ' + (diff.added.join(', ') || 'không có'),
            '- Bị gỡ (' + diff.removed_count + '): ' + (diff.removed.join(', ') || 'không có'),
            '- Đổi giá (' + diff.price_changes.length + '):',
            list(diff.price_changes, (c) => '  - ' + c.sku + ': ' + vnd(c.old_price) + ' → ' + vnd(c.new_price)),
            '- Đổi trạng thái (' + diff.status_changes.length + '):',
            list(diff.status_changes, (c) => '  - ' + c.sku + ': ' + c.old_status + ' → ' + c.new_status),
            '- Đổi ảnh gốc (' + diff.media_changes.length + ' SP):',
            list(diff.media_changes, (c) => '  - ' + c.sku + ': +' + c.added_images.length + ' ảnh, -' + c.removed_images.length + ' ảnh'),
            '',
            '## Ảnh tự lưu (assets/img/products/)',
            '- Tổng: ' + s.total + ' ảnh; tải mới/chuyển WebP: ' + s.downloaded + '; bỏ qua (không đổi): ' + s.skipped + '; lỗi: ' + s.failed + '; giữ định dạng gốc: ' + (s.fallback_original || 0),
            '- Dung lượng ảnh mới: ' + ((s.bytes_total || 0) / 1024).toFixed(0) + ' KB',
            '',
            '## Kiểm tra',
            '- validate.mjs + safety gate (mất >10% catalog hoặc giá = 0 thì chặn): đã qua.',
            '- Xem tab Files changed của PR để thấy toàn bộ file đổi (data/sync-diff.json không còn commit nữa — chỉ dùng trong lần chạy để soạn mô tả này).',
          ];
          fs.writeFileSync('/tmp/PR_BODY.md', lines.join('\n') + '\n');
          console.log('Da soan mo ta PR (' + lines.length + ' dong).');
          "

      - name: Dọn file trung gian (chỉ commit dữ liệu + ảnh)
        if: steps.guard.outputs.skip != 'true' && steps.lastchunk.outputs.skip_pipeline != 'true'
        run: |
          # File trung gian chỉ dùng trong lần chạy, KHÔNG commit nữa.
          # Mỗi danh mục có 5 file: products-<id>.full.json(.jsonl),
          # state-<id>.json, run-stats-<id>.json, discovery-<id>.json.
          # (export-site-data đã đọc xong wrapper ở bước trước; lần chạy sau
          # lấy batch từ file hàng đợi, không dùng state.json.)
          for CAT in dem dem-k-bedding k-bedding tre-em bo-chan-ga-artemis bo-chan-ga ga vo-goi chan-va-vo-chan ruot goi phu-kien; do
            rm -f "data/products-${CAT}.full.json" "data/products-${CAT}.full.jsonl" "data/state-${CAT}.json" "data/run-stats-${CAT}.json" "data/discovery-${CAT}.json"
          done
          rm -f data/sync-diff.json data/queue-batch.json data/queue-urls-*.txt data/queue-discovery.json data/queue-removed.json
          # sync-state.json không đưa vào PR chunk (mỗi job đều ghi lại
          # last_run_at/totals -> 2 PR sẽ conflict nhau khi merge).
          # Tiến độ vòng crawl giờ nằm ở data/crawl-queue.json (commit thẳng main).
          git checkout -- data/sync-state.json 2>/dev/null || true
          echo "Đã dọn file trung gian. File data/ còn lại:"
          ls -la data/

      - name: Mở PR để duyệt thủ công
        if: steps.guard.outputs.skip != 'true' && steps.lastchunk.outputs.skip_pipeline != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Cập nhật catalog từ everon.com"
          branch: "sync/catalog-${{ github.run_id }}"
          commit-message: "sync: cập nhật catalog từ everon.com"
          body-path: /tmp/PR_BODY.md
